events {
    worker_connections 1024;
    }

http {



    server {
        listen 80;

        location / {
            proxy_pass http://main:8000;
            proxy_set_header Host $host;
            proxy_set_header x_Real-IP $remote_addr;


        }

        location /input/ {
            proxy_pass http://input:8000;
            proxy_set_header Host $host;
            proxy_set_header x_Real-IP $remote_addr;



        }

        location /stat/ {
            proxy_pass http://stat:8000/;

            proxy_set_header Host $host;
            proxy_set_header x_Real-IP $remote_addr;
        }
    }
}
