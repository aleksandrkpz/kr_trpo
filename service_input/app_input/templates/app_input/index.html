<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ввод данных пациента</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css"/>

    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f9f9f9; }
        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; }
        .form-group { margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="text"], input[type="date"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background-color: #218838; }
        .choices__list--multiple .choices__item { background-color: #007bff; border: 1px solid #0056b3; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Регистрация нового пациента</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>ФИО пациента:</label>
            <input type="text" name="name" required placeholder="Иванов Иван Иванович">
        </div>

        <div class="form-group">
            <label>Дата рождения:</label>
            <input type="date" name="birthday" required>
        </div>

        <div class="form-group">
            <label>Пол:</label>
            <select name="gender" required>
                <option value="M">Мужской</option>
                <option value="F">Женский</option>
            </select> 
        </div>

        <div class="form-group">
            <label>Выявленные болезни:</label>
            <select name="disease" id="disease-select" multiple>
                {% for d in all_diseases %}
                    <option value="{{ d.id }}">{{ d.disease }}</option>
                {% endfor %}
            </select>
        </div>
        
        <button type="submit">Сохранить в базу</button>
    </form>
</div>

    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
    <script>
        const element = document.getElementById('disease-select');
        const choices = new Choices(element, {
            removeItemButton: true,
            noChoicesText: 'Больше болезней в базе нет',
            itemSelectText: 'Нажмите для выбора',
            placeholder: true,
            placeholderValue: 'Выберите болезни из списка'
        });
    </script>
</body>
</html>
